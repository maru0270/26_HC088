android.useAndroidX=true
android.suppressUnsupportedCompileSdk=35
ksp.incremental=false
kotlin.compiler.execution.strategy=in-process

# The APK packager reads application resources while closing the archive.
# Keep enough heap for the packaging worker and limit parallel workers so a
# debug build does not fail with ApkFlinger/Java heap space on Windows.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
